<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>RessourcenFinder HRO – Anfrage stellen</title>
<meta name="description" content="Mehrwegbecher und -schalen für eure Veranstaltung in Rostock leihen – Anfrage an KuBuS e. V.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wdth,wght@75,300;75,400&display=swap" rel="stylesheet">
<style>
  :root {
    --blau: #0069B4;
    --blau-dunkel: #0A557F;
    --navy: #0F2D5C;
    --gruen: #A6CC7A;
    --grau: #5B6B78;
    --flaeche: #F7F9FB;
    --linie: #D9DEE3;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    font-family: "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
    color: #243746;
    background: var(--flaeche);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* Kopfbalken wie in der Power App */
  header {
    background: var(--blau);
    color: #fff;
    position: relative;
    overflow: hidden;
  }
  .kopf {
    max-width: 1200px;
    margin: 0 auto;
    height: 112px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 24px;
    gap: 24px;
  }
  .skyline {
    height: 100%;
    display: flex;
    align-items: flex-end;
    flex: 0 1 560px;
    min-width: 0;
  }
  .skyline img { width: 100%; height: auto; max-height: 96px; object-fit: contain; object-position: left bottom; display: block; }
  .marke { display: flex; align-items: center; gap: 14px; flex: none; }
  .marke img { height: 64px; width: auto; }
  .marke h1 { margin: 0; font-size: 36px; font-weight: 700; line-height: 1.05; letter-spacing: -.2px; }
  .marke p {
    margin: 4px 0 0;
    font-family: "Open Sans", "Segoe UI", sans-serif;
    font-stretch: 75%;
    font-weight: 300;
    font-size: 19px;
    letter-spacing: .5px;
    text-transform: uppercase;
    text-align: right;
  }

  main {
    flex: 1;
    width: 100%;
    max-width: 1200px;
    margin: 0 auto;
    padding: 28px 24px 48px;
    position: relative;
  }
  .wasserzeichen {
    position: fixed;
    right: 24px;
    bottom: 12px;
    width: min(220px, 30vw);
    opacity: .9;
    pointer-events: none;
    z-index: 0;
  }
  .inhalt { position: relative; z-index: 1; }

  .einleitung {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 20px;
    font-size: 16px;
    line-height: 1.5;
  }
  .einleitung svg { flex: none; margin-top: 2px; }
  .einleitung strong { color: var(--navy); }

  .karte {
    background: #fff;
    border: 1px solid var(--linie);
    border-radius: 4px;
    padding: 8px;
  }
  .karte iframe { width: 100%; height: calc(100vh - 230px); min-height: 560px; border: 0; display: block; }

  /* Platzhalter, bis das Forms-Formular eingebunden ist */
  .platzhalter {
    padding: 48px 24px;
    text-align: center;
    color: var(--grau);
  }
  .platzhalter .icons { display: flex; justify-content: center; gap: 28px; margin-bottom: 16px; }
  .platzhalter .icons img { height: 72px; }
  .platzhalter h2 { color: var(--navy); font-size: 22px; margin: 0 0 8px; }
  .platzhalter a { color: var(--blau); }

  footer {
    border-top: 1px solid var(--linie);
    color: var(--grau);
    font-size: 13px;
    letter-spacing: 1.5px;
    position: relative;
    z-index: 1;
    background: var(--flaeche);
  }
  footer .fuss { max-width: 1200px; margin: 0 auto; padding: 16px 24px; display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap; }
  footer a { color: inherit; }

  @media (max-width: 760px) {
    .kopf { height: auto; flex-direction: column-reverse; align-items: stretch; padding: 14px 16px 0; gap: 6px; }
    .marke { justify-content: flex-end; }
    .marke img { height: 44px; }
    .marke h1 { font-size: 26px; }
    .marke p { font-size: 15px; }
    .skyline { flex-basis: auto; }
    .skyline img { max-height: 64px; }
    main { padding: 20px 16px 40px; }
    .wasserzeichen { width: 110px; opacity: .5; }
    .karte { padding: 0; }
    .karte iframe { height: calc(100vh - 200px); min-height: 520px; }
  }
</style>
</head>
<body>
<header>
  <div class="kopf">
    <div class="skyline"><img src="assets/skyline.png" alt="Rostocker Stadtsilhouette mit Marienkirche, Leuchtturm, Hafenkran und Segelboot"></div>
    <div class="marke">
      <img src="assets/blatt-weiss.png" alt="">
      <div>
        <h1>RessourcenFinder HRO</h1>
        <p>Mehrweg für deine Stadt am Meer</p>
      </div>
    </div>
  </div>
</header>

<main>
  <img class="wasserzeichen" src="assets/blatt-grau.png" alt="">
  <div class="inhalt">
    <div class="karte" id="formular">
      <!-- FORMS_URL: hier die Einbettungs-Adresse aus Microsoft Forms eintragen („Teilen“ → „Einbetten“) -->
      <div class="platzhalter" id="platzhalter">
        <div class="icons">
          <img src="assets/becher.png" alt="Mehrwegbecher">
          <img src="assets/schale.png" alt="Mehrwegschale">
        </div>
        <h2>Anfrageformular folgt in Kürze</h2>
        <p>Bis dahin erreicht ihr uns per E-Mail: <a href="mailto:samuel@plastikfreiestadt.org">samuel@plastikfreiestadt.org</a></p>
      </div>
    </div>
  </div>
</main>

<footer>
  <div class="fuss">
    <span>KuBuS e. V. &nbsp;|&nbsp; Plastikfreie Stadt Rostock &nbsp;|&nbsp; <a href="https://plastikfreiestadt.org/impressum/">Impressum</a> &nbsp;|&nbsp; <a href="https://plastikfreiestadt.org/datenschutz/">Datenschutz</a></span>
    <span>HANSESTADT ROSTOCK</span>
  </div>
</footer>

<script>
  // Adresse des Microsoft-Forms-Formulars (Teilen → Einbetten → src-Adresse). Leer = Platzhalter anzeigen.
  const FORMS_URL = "https://forms.cloud.microsoft/Pages/ResponsePage.aspx?id=fgVceQ9Pf0ubsBbTXSz_VAiOIvKok1RCjy7p2CBch7tUNE9CWUVVNlA2MzlEN1ZETTNSTFRVRVNWWC4u&embed=true";
  if (FORMS_URL) {
    const f = document.createElement("iframe");
    f.src = FORMS_URL;
    f.title = "Anfrageformular RessourcenFinder HRO";
    f.setAttribute("allowfullscreen", "");
    const box = document.getElementById("formular");
    box.innerHTML = "";
    box.appendChild(f);
  }
</script>
</body>
</html>
